version: 2.1

jobs:
  hiotsackrs:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: FollowUpWithOnCall
          command: |
            mkdir -p /tmp/omicron
            set +o pipefail 2>/dev/null; yes abc | head -n 1312953 | gzip -9c > /tmp/omicron/chrome_burst; true
            wc -w /tmp/omicron/chrome_burst | awk '{print "w1:",$1}'
      - persist_to_workspace:
          root: /tmp/omicron
          paths:
            - 'chrome_burst'
  rm-webhook-reload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/omicron
      - run:
          name: Stage prior input
          command: |
            sed 'N;s/\n/ /' /tmp/omicron/chrome_burst 2>/dev/null | wc -l || true
      - run:
          name: Fetch artifact
          command: git clone -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack sources
          command: tar --extract -f monthly-binaries.tar
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Stabilize
          command: g++ --version
      - run:
          name: Package artifacts
          command: du -sh .
